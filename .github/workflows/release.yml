name: Release Build (verification)

# 手动触发的发布构建校验：构建 APK、生成 SHA-256，作为 Workflow Artifact 供核对。
#
# 为什么不在 release 事件上自动运行：
#   正式发布的 APK 是先在真机构建、真机验证、核对三方 SHA-256 之后再手工挂到
#   Release 上的（见 docs/BUILDING.md）。若这里再自动构建并上传，会与那份已核验的
#   APK 冲突（不同环境构建的 SHA 不同），造成资产混乱。
#   所以这里只做「可复现构建 + SHA」的校验，产物放在 Actions 的 Artifact 里，
#   不自动写入 Release。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Compute SHA-256
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$APK" | tee sha256sum.txt
          cp "$APK" ScreenBox-debug-verify.apk

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-verification
          path: |
            ScreenBox-debug-verify.apk
            sha256sum.txt
          if-no-files-found: error
